name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdist:
    name: Source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: Check tag against package version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          package_version=$(python -c 'import ast, pathlib; tree = ast.parse(pathlib.Path("src/pysamstats/__init__.py").read_text()); print(next(node.value.value for node in tree.body if isinstance(node, ast.Assign) and any(isinstance(target, ast.Name) and target.id == "__version__" for target in node.targets)))')
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build source distribution
        run: uv build --sdist

      - uses: actions/upload-artifact@v7
        with:
          name: pysamstats-sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: ${{ matrix.platform }} wheels
    needs: sdist
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-latest
            arch: x86_64
            artifact: linux-x86_64
          - platform: Linux aarch64
            os: ubuntu-24.04-arm
            arch: aarch64
            artifact: linux-aarch64
          - platform: macOS arm64
            os: macos-15
            arch: arm64
            artifact: macos-arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: pysamstats-sdist
          path: dist

      - name: Select source distribution
        shell: bash
        run: echo "SDIST=$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" >> "$GITHUB_ENV"

      - name: Build and test wheels
        uses: pypa/cibuildwheel@v4.3.5
        env:
          CIBW_ARCHS: ${{ matrix.arch }}
          CIBW_BUILD: cp311-* cp312-* cp313-* cp314-* cp315-*
          CIBW_SKIP: "*-musllinux_*"
          CIBW_BEFORE_ALL: >
            printf 'pysam==0.24.1\n' > /tmp/pysamstats-build-constraints.txt
          CIBW_ENVIRONMENT: >
            PIP_BUILD_CONSTRAINT=/tmp/pysamstats-build-constraints.txt
            PIP_VERBOSE=1
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          CIBW_TEST_GROUPS: test
          CIBW_TEST_COMMAND: >
            python -c 'import pysam; print("test pysam:", pysam.__version__)' &&
            python -m pytest {project}/tests -q --tb=short
        with:
          package-dir: ${{ env.SDIST }}

      - uses: actions/upload-artifact@v7
        with:
          name: pysamstats-wheels-${{ matrix.artifact }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  distributions:
    name: Distribution artifacts
    needs: [sdist, wheels]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: pysamstats-*
          path: dist
          merge-multiple: true
      - uses: actions/upload-artifact@v7
        with:
          name: pysamstats-distributions
          path: dist/*
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: distributions
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/pysamstats
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pysamstats-distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: Create GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [distributions, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: pysamstats-distributions
          path: dist
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --verify-tag
