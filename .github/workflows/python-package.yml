name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: uv sync --group test --no-install-project

      - name: Build and install package
        run: |
          uv build --wheel
          uv pip install --no-deps --force-reinstall dist/*.whl

      - name: Verify installed package
        run: |
          uv run --no-sync python -c 'from pathlib import Path; import pysamstats; path = Path(pysamstats.__file__).resolve(); assert "site-packages" in path.parts, path'

      - name: Test
        run: uv run --no-sync pytest -q --tb=short
