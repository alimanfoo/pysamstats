name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python 3.14
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: Install
        run: |
          uv sync --group test
          uv run --no-sync --with setuptools --with cython python setup.py build_ext --inplace

      - name: Test
        run: uv run --no-sync pytest -q --tb=short

  # Branch protection requires only this job, so jobs can be added, renamed or
  # re-matrixed without editing protection. It must list every job in `needs`,
  # and runs even when one is skipped, since GitHub counts a skipped required
  # check as passing.
  required-checks-pass:
    name: Required checks pass
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'map_values(.result) | ., all(.[]; . == "success")' <<< "$NEEDS"
