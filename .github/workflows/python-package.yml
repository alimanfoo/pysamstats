name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request cancels that pull request's older run.
# Runs on main are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }} / ${{ matrix.dependencies }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
        dependencies: [current]
        # macOS runners are scarce (5 at once per account). The release
        # workflow already builds and tests a macOS wheel for every Python,
        # so here macOS covers only the oldest and newest.
        exclude:
          - os: macos-15
            python: "3.12"
          - os: macos-15
            python: "3.13"
          - os: macos-15
            python: "3.14"
        include:
          - os: ubuntu-latest
            python: "3.11"
            dependencies: floors

    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          version: "0.13.5"

      - name: Install dependencies
        run: uv sync --group test --no-install-project ${{ matrix.dependencies == 'floors' && '--resolution lowest-direct' || '' }}

      - name: Build and install package
        env:
          CFLAGS: ${{ runner.os == 'Linux' && '-Werror=discarded-qualifiers' || '-Werror=incompatible-pointer-types-discards-qualifiers' }}
        run: |
          uv build --wheel ${{ matrix.dependencies == 'floors' && '--build-constraints build-constraints.txt --verbose' || '' }}
          uv pip install --no-deps --force-reinstall dist/*.whl

      - name: Show dependency floors
        if: matrix.dependencies == 'floors'
        run: uv pip list

      - name: Verify installed package
        run: |
          uv run --no-sync python -c 'from pathlib import Path; import pysamstats; path = Path(pysamstats.__file__).resolve(); assert "site-packages" in path.parts, path'
          uv run --no-sync pysamstats --help

      - name: Test
        run: uv run --no-sync pytest -q --tb=short

  # Branch protection requires only this job, so jobs can be added, renamed or
  # re-matrixed without editing protection. It must list every job in `needs`,
  # and runs even when one is skipped, since GitHub counts a skipped required
  # check as passing.
  required-checks-pass:
    name: Required checks pass
    if: always()
    needs: [test]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: jq --exit-status 'map_values(.result) | ., all(.[]; . == "success")' <<< "$NEEDS"
