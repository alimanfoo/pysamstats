[build-system]
requires = [
    "setuptools>=77",
    "cython>=3.1",
    "pysam>=0.23.3,<0.25",
]
build-backend = "setuptools.build_meta"

[project]
name = "pysamstats"
dynamic = ["version"]
description = "A Python utility for calculating statistics against genome positions based on sequence alignments from a SAM, BAM, or CRAM file."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Alistair Miles", email = "alimanfoo@googlemail.com" },
]
classifiers = [
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "numpy>=2.0",
    "pysam>=0.24.1,<0.25",
]

[project.optional-dependencies]
hdf5 = ["tables>=3.10.1"]

[project.urls]
Source = "https://github.com/alimanfoo/pysamstats"
Issues = "https://github.com/alimanfoo/pysamstats/issues"

[project.scripts]
pysamstats = "pysamstats.cli:main"

[dependency-groups]
test = [
    "pytest>=7.2.1",
    "tables>=3.10.1",
]

[tool.setuptools.dynamic]
version = { attr = "pysamstats.__version__" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["pysamstats", "pysamstats.*"]
